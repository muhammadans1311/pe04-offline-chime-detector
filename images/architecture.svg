<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc">
<title id="title">PE-04 sound-to-light system architecture</title>
<desc id="desc">USB-C power feeds a 3.3 volt buck supply, and a microphone connects to a preamplifier, active low-pass filter, ESP32-S3 ADC and LED alerts.</desc>
<rect width="1160" height="300" rx="22" fill="#101f35"/>
<text x="42" y="45" fill="#f0f5fc" font-family="Arial,sans-serif" font-size="26" font-weight="700">PE-04 | Offline sound-to-visual alert</text>
<text x="43" y="73" fill="#a9bed7" font-family="Arial,sans-serif" font-size="14">Intended later team architecture · design-stage, not a validated hardware result</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#78d3cb"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <rect x="34" y="123" width="155" height="96" rx="13" fill="#18344b" stroke="#58bfbe" stroke-width="2"/><text x="111" y="161" fill="#fff" font-size="19" font-weight="700">Electret mic</text><text x="111" y="186" fill="#b9d1dd" font-size="14">Acoustic input</text>
 <rect x="229" y="123" width="170" height="96" rx="13" fill="#18344b" stroke="#58bfbe" stroke-width="2"/><text x="314" y="161" fill="#fff" font-size="18" font-weight="700">AD8656</text><text x="314" y="186" fill="#b9d1dd" font-size="14">Analog preamp</text>
 <rect x="439" y="123" width="175" height="96" rx="13" fill="#18344b" stroke="#58bfbe" stroke-width="2"/><text x="526" y="161" fill="#fff" font-size="18" font-weight="700">TLV9062</text><text x="526" y="186" fill="#b9d1dd" font-size="14">4-pole low-pass</text>
 <rect x="654" y="123" width="205" height="96" rx="13" fill="#18344b" stroke="#58bfbe" stroke-width="2"/><text x="756" y="161" fill="#fff" font-size="18" font-weight="700">ESP32-S3 ADC</text><text x="756" y="186" fill="#b9d1dd" font-size="14">Planned offline DSP</text>
 <rect x="899" y="123" width="221" height="96" rx="13" fill="#18344b" stroke="#58bfbe" stroke-width="2"/><text x="1009" y="161" fill="#fff" font-size="18" font-weight="700">Visual alerts</text><text x="1009" y="186" fill="#b9d1dd" font-size="14">3 independent LEDs</text>
 </g>
<g stroke="#78d3cb" stroke-width="3" marker-end="url(#arrow)"><line x1="191" y1="171" x2="222" y2="171"/><line x1="401" y1="171" x2="432" y2="171"/><line x1="616" y1="171" x2="647" y2="171"/><line x1="861" y1="171" x2="892" y2="171"/></g>
<text x="43" y="265" font-family="Arial,sans-serif" font-size="16" fill="#c8d6e8">USB-C 5 V  →  switching 3.3 V supply  →  MCU + analog stages</text>
